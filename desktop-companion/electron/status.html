<!doctype html><html lang="zh"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Macau POS Desktop</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:#0f172a; color:#e2e8f0; display:flex; min-height:100vh;
         align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; background:#1e293b; border:1px solid #334155;
          border-radius:16px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { font-size:12px; color:#94a3b8; margin-bottom:16px; }
  .row { display:flex; align-items:center; gap:8px; padding:10px 12px; background:#0f172a;
         border-radius:10px; margin-bottom:12px; font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#64748b; flex:none; }
  .dot.ok { background:#22c55e; }
  .dot.bad { background:#ef4444; }
  .dot.warn { background:#eab308; }
  button { width:100%; padding:12px; border:0; border-radius:10px; cursor:pointer;
           font-size:14px; font-weight:600; background:#2563eb; color:#fff; }
  button:hover { background:#1d4ed8; }
  button:disabled { opacity:.5; cursor:default; }
  .note { font-size:11px; color:#94a3b8; margin-top:12px; line-height:1.5; }
  code { background:#0f172a; padding:1px 5px; border-radius:4px; color:#7dd3fc; }
</style></head><body>
  <div class="card">
    <h1>Macau POS Desktop</h1>
    <div class="sub">桌面 POS 殼 · 網頁由 Vercel 載入，更新只推網頁唔使重打包</div>
    <div class="row"><span id="verDot" class="dot"></span><span>App 版本：<code id="ver">…</code></span></div>
    <div class="row"><span id="updDot" class="dot"></span><span id="updStatus">就緒</span></div>
    <button id="checkBtn">檢查更新</button>
    <button id="installBtn" style="margin-top:10px; background:#16a34a; display:none;">安裝並重啟</button>
    <div class="note">
      「檢查更新」會由發佈伺服器拉最新安裝包並覆蓋安裝（只喺 runtime / companion 改動時需要；<br/>
      網頁本身永遠由 Vercel 最新版提供，唔使喺度更新）。
    </div>
  </div>
<script>
  const verDot = document.getElementById('verDot');
  const ver = document.getElementById('ver');
  const updDot = document.getElementById('updDot');
  const updStatus = document.getElementById('updStatus');
  const checkBtn = document.getElementById('checkBtn');
  const installBtn = document.getElementById('installBtn');

  function render(state) {
    updStatus.textContent = state.info || '就緒';
    updDot.className = 'dot ' + ({
      idle: '', checking: 'warn', available: 'warn', downloading: 'warn',
      downloaded: 'ok', latest: 'ok', error: 'bad',
    }[state.status] || '');
    installBtn.style.display = state.status === 'downloaded' ? 'block' : 'none';
  }

  // 初始版本
  if (window.companionShell && window.companionShell.getVersion) {
    window.companionShell.getVersion().then(v => { ver.textContent = v; });
  }
  // 接收 main 推送嘅更新狀態
  if (window.companionShell && window.companionShell.onUpdateStatus) {
    window.companionShell.onUpdateStatus(render);
  }
  // 手動檢查
  checkBtn.addEventListener('click', () => {
    checkBtn.disabled = true;
    if (window.companionShell && window.companionShell.checkUpdate) {
      window.companionShell.checkUpdate().then(render);
    }
    setTimeout(() => (checkBtn.disabled = false), 1500);
  });
  // 安裝
  installBtn.addEventListener('click', () => {
    if (window.companionShell && window.companionShell.quitAndInstall) {
      window.companionShell.quitAndInstall();
    }
  });
</script>
</body></html>
